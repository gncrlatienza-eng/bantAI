name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

jobs:
  ai:
    name: AI/ML (ruff, pytest, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: pip-audit -r requirements.txt

  backend:
    name: Backend (eslint, prettier, jest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Stale/missing generated Prisma types produce hundreds of false
      # "unsafe access" lint errors that have nothing to do with the change
      # being reviewed — see DEV_LOG 2026-08-16.
      - run: npx prisma generate --schema database/prisma/schema.prisma
      - run: npm run lint
      - run: npx prettier --check .
      - run: npx jest
      - run: npm run build
      - run: npm audit --audit-level=high

  web:
    name: Web Dashboard (eslint, prettier, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high

  mobile:
    name: Mobile (ktlint, detekt, compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Invoked via `bash` explicitly rather than `./gradlew` -- removes any
      # dependency on the execute bit or shebang line resolving correctly on
      # the runner, on top of the chmod above.
      - run: bash gradlew :app:ktlintCheck :app:detekt :app:compileDebugKotlin --console=plain

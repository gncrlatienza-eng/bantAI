# Minimal overrides on top of detekt's own default ruleset
# (buildUponDefaultConfig = true in app/build.gradle.kts).
#
# Deliberately small for this first pass -- everything currently in the
# codebase is grandfathered into detekt-baseline.xml regardless of these
# settings, so tuning individual rules further is a follow-up once real
# (non-baselined) findings start surfacing on new code.

style:
  MaxLineLength:
    # Matches the line length already chosen for ai/ and backend/+web/'s
    # Prettier configs -- one consistent width across the whole monorepo.
    maxLineLength: 120
  ReturnCount:
    # Guard clauses (single early-return validation checks at the top of a
    # function) are the idiomatic Kotlin style already used elsewhere in this
    # codebase (see the pre-existing ReturnCount baseline entries) -- counting
    # them against the same 2-return budget as branchy control flow penalizes
    # the more readable style. Only non-guard-clause returns still count.
    excludeGuardClauses: true

complexity:
  TooManyFunctions:
    # Compose screen files are one public entry-point composable plus many
    # small private sub-composables/helpers -- that decomposition is the
    # idiomatic (and more readable) alternative to a few giant functions, so
    # counting private helpers against the same budget as a class's public
    # API surface penalizes the style this codebase already uses throughout
    # ui/screens/. Only public functions count now.
    ignorePrivate: true

naming:
  FunctionNaming:
    # PascalCase is the official Jetpack Compose convention for @Composable
    # functions (they're used like widgets, not verbs) -- every composable
    # already in this codebase follows it. Without this exemption, detekt's
    # default lowerCamelCase rule flags each one now that new code is
    # exercising it instead of relying on the baseline to hide it.
    ignoreAnnotated: ['Composable']

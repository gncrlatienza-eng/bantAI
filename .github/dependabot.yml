version: 2

# One PR for all minor/patch bumps and one for all major bumps per folder,
# opened against develop (our integration branch) once a month.
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: pip
    directory: /ai
    target-branch: develop
    # Only bump a requirement when its current range no longer allows the new
    # version. Raising ">=" floors forced numpy/scipy releases that need Python 3.12.
    versioning-strategy: increase-if-necessary
    ignore:
      # Dependabot drops the "+cpu" local version, which would swap in the much
      # larger CUDA build. Update torch by hand.
      - dependency-name: torch
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: gradle
    directory: /mobile
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
